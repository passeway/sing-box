name: Manager regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm-slim, ubuntu:24.04, alpine:3.22]
    steps:
      - uses: actions/checkout@v4
      - name: Download the same official core used by the installer
        run: |
          version=$(sed -n 's/^SING_BOX_VERSION="\([^"]*\)"/\1/p' sing-box.sh)
          mkdir -p "$RUNNER_TEMP/sing-box-core"
          curl -fL --retry 2 --connect-timeout 10 --max-time 180 "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/sing-box-core/release.tar.gz"
          tar -xzf "$RUNNER_TEMP/sing-box-core/release.tar.gz" -C "$RUNNER_TEMP/sing-box-core" --strip-components=1 "sing-box-${version}-linux-amd64/sing-box"
      - name: Syntax, regression and real proxy traffic
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/sing-box-core:/core:ro" -e SING_BOX_TEST_BINARY=/core/sing-box -w /repo "$TEST_IMAGE" sh -ec '
            if command -v apk >/dev/null; then
              apk add --no-cache bash python3 curl openssl coreutils iproute2 gcompat libstdc++ logrotate
            else
              apt-get update
              apt-get install -y --no-install-recommends bash python3 curl openssl ca-certificates coreutils iproute2 logrotate
            fi
            bash -n sing-box.sh
            bash -n disk-cleanup-full.sh
            python3 -m unittest discover -s tests -v
          '
