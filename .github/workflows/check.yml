name: Manager regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Lint shell scripts
        run: shellcheck -S warning sing-box.sh tests/ci/run.sh
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: [debian:bookworm-slim, debian:trixie-slim, ubuntu:24.04, alpine:3.22]
    steps:
      - uses: actions/checkout@v6
      - name: Download the same official core used by the installer
        run: |
          source ./sing-box.sh
          architecture=$(get_architecture)
          mkdir -p "$RUNNER_TEMP/sing-box-core"
          version=$(latest_release_version "$architecture" "$RUNNER_TEMP/sing-box-core/release.json")
          curl -fL --retry 2 --connect-timeout 10 --max-time 180 "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-${architecture}.tar.gz" -o "$RUNNER_TEMP/sing-box-core/release.tar.gz"
          tar -xzf "$RUNNER_TEMP/sing-box-core/release.tar.gz" -C "$RUNNER_TEMP/sing-box-core" --strip-components=1 "sing-box-${version}-linux-${architecture}/sing-box"
      - name: Syntax, regression, real proxy traffic and real service managers
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: bash tests/ci/run.sh
